name: Sync Staging Version

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0

      - name: Align staging version with main
        run: |
          git fetch origin main
          MAIN_VERSION=$(git show origin/main:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          STAGING_VERSION=$(node -p 'require("./package.json").version')

          if [ "$MAIN_VERSION" = "$STAGING_VERSION" ]; then
            echo "Staging is already at version $STAGING_VERSION, nothing to do."
            exit 0
          fi

          echo "Bumping staging version from $STAGING_VERSION to $MAIN_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version "$MAIN_VERSION" --no-git-tag-version --allow-same-version
          git add package.json package-lock.json
          git commit -m "chore: align staging version with main ($MAIN_VERSION)"
          git push origin staging
